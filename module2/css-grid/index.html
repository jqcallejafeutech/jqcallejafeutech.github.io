<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile-First CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="grid-container">

        <header class="header">
            <h1>Website Banner</h1>
        </header>

        <nav class="sidebar left">
            <h3>Left Menu</h3>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <main class="content">
            <h2>Main Content</h2>
            <p>This is the main content area.</p>
        </main>

        <aside class="sidebar right">
            <h3>Right Panel</h3>
            <p>Announcements / Ads</p>
        </aside>

        <footer class="footer">
            <p>© 2026 My Website</p>
        </footer>

    </div>

</body>

</html>
