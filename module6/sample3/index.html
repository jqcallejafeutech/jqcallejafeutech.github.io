<!DOCTYPE html>
<html>

<head>
    <title>AJAX External API Auto-Refresh Demo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <h1>AJAX External Website Auto-Refresh Demo</h1>

    <p>
        <strong>Page Loaded At:</strong>
        <span id="loadTime"></span>
    </p>

    <p>
        <strong>Last Data Refresh:</strong>
        <span id="lastRefresh">Not yet loaded</span>
    </p>

    <hr>

    <button id="loadPosts">Load Posts</button>
    <button id="startAuto">Start Auto Refresh (5s)</button>
    <button id="stopAuto">Stop Auto Refresh</button>

    <hr>

    <div id="content">
        <h3>Posts will appear here...</h3>
    </div>

    <script src="script.js"></script>
</body>

</html>
